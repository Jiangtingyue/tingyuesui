<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>小月的私人邮箱 · Moon Mail</title>
<style>
:root {
  --pink: #f7e6f2;
  --lilac: #dcd7ff;
  --glass-bg: rgba(255, 255, 255, 0.45);
  --glass-border: rgba(255, 255, 255, 0.6);
  --glass-shadow: 0 8px 32px rgba(68, 49, 93, 0.12);
  --ink: #1d1d1f;
  --muted: #86868b;
  --accent: #6f61ff;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --serif: "Songti SC", "Noto Serif SC", serif;
  --safe-bottom: env(safe-area-inset-bottom, 20px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: var(--sans);
  color: var(--ink);
  background: linear-gradient(135deg, var(--pink), var(--lilac));
  background-attachment: fixed;
  overflow: hidden;
  height: 100vh;
  height: 100dvh;
}

/* 背景光效 */
body::before, body::after {
  content: ""; position: absolute; border-radius: 50%; filter: blur(60px); z-index: -1;
}
body::before {
  width: 300px; height: 300px; background: rgba(168,151,255,0.6); top: -50px; left: -50px;
}
body::after {
  width: 250px; height: 250px; background: rgba(255,255,255,0.8); bottom: 10%; right: -20px;
}

.view {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  transition: transform 0.4s cubic-bezier(0.36, 0.66, 0.04, 1), opacity 0.3s ease;
}

/* --- 列表页 --- */
#listView { z-index: 10; transform: translateX(0); }
#listView.hidden { transform: translateX(-30%); opacity: 0; pointer-events: none; }

.header {
  padding: calc(env(safe-area-inset-top, 20px) + 20px) 24px 16px;
  background: rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border);
  position: sticky; top: 0; z-index: 20;
}
.header-title { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }

.mail-list-container {
  flex: 1; overflow-y: auto; padding: 16px 16px calc(80px + var(--safe-bottom));
  scrollbar-width: none;
}
.mail-list-container::-webkit-scrollbar { display: none; }

.mail-card {
  background: var(--glass-bg);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: 20px; padding: 18px; margin-bottom: 14px;
  box-shadow: var(--glass-shadow);
  transition: transform 0.2s;
}
.mail-card:active { transform: scale(0.98); }
.mail-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.writer-name { font-weight: 700; font-size: 16px; }
.mail-date { font-size: 13px; color: var(--muted); }
.mail-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.mail-summary { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.status-tag {
  font-size: 11px; padding: 4px 8px; border-radius: 10px; font-weight: 600;
}
.tag-scheduled { background: rgba(111,97,255,0.15); color: var(--accent); }
.tag-draft { background: rgba(243,182,63,0.2); color: #c28815; }

/* --- 底部导航栏 --- */
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(64px + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5);
  border-top: 1px solid var(--glass-border);
  display: flex; justify-content: space-around; align-items: center; z-index: 30;
}
.tab-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--muted); font-size: 11px; font-weight: 600; background: none; border: none; cursor: pointer;
}
.tab-item.active { color: var(--accent); }
.tab-icon { font-size: 22px; }

/* --- 阅读页 --- */
#readerView {
  z-index: 20; transform: translateX(100%); background: linear-gradient(135deg, #fffdf8, var(--pink));
}
#readerView.active { transform: translateX(0); }

.reader-header {
  padding: calc(env(safe-area-inset-top, 20px) + 12px) 16px 12px;
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(0,0,0,0.05);
}
.btn-back { background: rgba(0,0,0,0.05); border-radius: 50%; width: 36px; height: 36px; display: grid; place-items: center; font-size: 20px; border: none; }

.reader-scroll {
  flex: 1; overflow-y: auto; padding: 24px; scrollbar-width: none;
}
.reader-scroll::-webkit-scrollbar { display: none; }

.read-title { font-family: var(--serif); font-size: 26px; font-weight: 600; margin-bottom: 16px; line-height: 1.3; }
.read-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; padding-bottom: 16px; border-bottom: 1px solid rgba(0,0,0,0.08); }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #2a2a30, #767184); color: white; display: grid; place-items: center; font-weight: bold; font-family: var(--serif);}
.meta-info { display: flex; flex-direction: column; }
.meta-sender { font-weight: 600; font-size: 15px; }
.meta-date { font-size: 13px; color: var(--muted); margin-top: 2px; }

.read-body { font-family: var(--serif); font-size: 17px; line-height: 1.8; color: #25222b; white-space: pre-wrap; padding-bottom: 40px;}

.draft-edit { width: 100%; min-height: 50vh; background: transparent; border: none; font-family: var(--serif); font-size: 17px; line-height: 1.8; color: #25222b; outline: none; resize: none; }

.action-btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 16px; font-weight: 600; font-size: 14px;}


/* === Moon Mail private-letter material pass === */
:root{
  --pink:#f3dce8;
  --lilac:#d9d5ee;
  --paper:#fffdf8;
  --paper-warm:#fbf4e9;
  --paper-edge:rgba(121,91,55,.18);
  --ink:#302a2d;
  --muted:#8a7f84;
  --accent:#806d93;
  --glass-bg:rgba(255,255,255,.42);
  --glass-border:rgba(255,255,255,.68);
  --glass-shadow:0 18px 50px rgba(73,54,75,.14);
}

html,body{background:transparent!important;}
body{
  position:relative;
  isolation:isolate;
  color:var(--ink);
  background:
    radial-gradient(circle at 14% 8%,rgba(255,255,255,.93),transparent 26%),
    radial-gradient(circle at 88% 14%,rgba(231,209,232,.88),transparent 33%),
    radial-gradient(circle at 72% 88%,rgba(252,234,220,.78),transparent 34%),
    linear-gradient(145deg,#f8e8ef 0%,#eee6f3 48%,#f7eee9 100%)!important;
}
body::before{
  width:280px;height:280px;top:-105px;left:-85px;
  background:rgba(205,171,205,.44);filter:blur(72px);opacity:.84;
}
body::after{
  width:260px;height:260px;right:-90px;bottom:-80px;
  background:rgba(255,236,218,.76);filter:blur(76px);opacity:.9;
}
.app-shell{position:relative;height:100%;}
.app-shell::before{
  content:"";position:absolute;inset:14px;border-radius:30px;pointer-events:none;z-index:0;
  border:1px solid rgba(255,255,255,.48);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
  background:
    linear-gradient(135deg,rgba(255,255,255,.17),transparent 38%),
    repeating-linear-gradient(90deg,rgba(89,65,74,.018) 0 1px,transparent 1px 6px);
}
.view{inset:0;padding:18px;}

/* Header becomes a small floating glass plaque rather than a web-app bar. */
.header{
  position:relative;top:auto;z-index:20;
  width:max-content;min-width:164px;max-width:76%;
  margin:4px auto 12px;padding:12px 22px 11px;
  border:1px solid rgba(255,255,255,.78);border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.34));
  box-shadow:0 12px 34px rgba(83,59,77,.12),inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:blur(22px) saturate(1.22);-webkit-backdrop-filter:blur(22px) saturate(1.22);
}
.header-title{
  font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.045em;
  text-align:center;color:#4e4148;text-shadow:0 1px 0 rgba(255,255,255,.7);
}

/* Letters are paper objects, staggered like a private letter tray. */
.mail-list-container{
  position:relative;z-index:2;flex:1;overflow-y:auto;
  width:min(860px,100%);margin:0 auto;
  padding:8px 13px 100px;scroll-padding-bottom:96px;
  display:flex;flex-direction:column;gap:13px;
  mask-image:linear-gradient(to bottom,transparent 0,#000 13px,#000 calc(100% - 70px),transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 13px,#000 calc(100% - 70px),transparent 100%);
}
.mail-card{
  position:relative;width:100%;margin:0;padding:17px 19px 17px 21px;overflow:hidden;
  border:1px solid var(--paper-edge);border-radius:16px;
  background:
    radial-gradient(circle at 8% 4%,rgba(255,255,255,.96),transparent 23%),
    repeating-linear-gradient(0deg,rgba(115,82,70,.018) 0 1px,transparent 1px 4px),
    linear-gradient(100deg,#fffefb 0%,#fbf5ec 58%,#fffdf8 100%);
  box-shadow:0 14px 32px rgba(85,61,64,.115),0 2px 7px rgba(85,61,64,.06),inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:none;-webkit-backdrop-filter:none;
  transform-origin:center;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.mail-card:nth-child(3n+1){align-self:flex-start;transform:rotate(-.55deg)}
.mail-card:nth-child(3n+2){align-self:flex-end;transform:rotate(.55deg)}
.mail-card:nth-child(3n){align-self:center;transform:rotate(-.18deg)}
.mail-card::before{
  content:"";position:absolute;right:-23px;top:-28px;width:74px;height:74px;border-radius:50%;
  border:1px solid rgba(146,108,119,.13);
  box-shadow:inset 0 0 0 9px rgba(146,108,119,.025);
  background:radial-gradient(circle,rgba(166,121,135,.045),transparent 64%);
  pointer-events:none;
}
.mail-card::after{
  content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:3px;
  background:linear-gradient(180deg,transparent,rgba(192,139,157,.38) 28%,rgba(154,136,184,.34) 67%,transparent);
  opacity:.65;
}
.mail-card:hover{
  transform:translateY(-2px) rotate(0deg);border-color:rgba(154,123,135,.28);
  box-shadow:0 20px 44px rgba(80,57,64,.15),0 4px 10px rgba(80,57,64,.07),inset 0 1px 0 rgba(255,255,255,.94);
}
.mail-card:active{transform:scale(.987) rotate(0deg)}
.mail-card-top{margin-bottom:8px;gap:12px;}
.writer-name{font-family:var(--serif);font-size:15px;font-weight:600;color:#504149;letter-spacing:.05em;}
.mail-date{
  flex:0 0 auto;font-family:var(--sans);font-size:11px;color:#9c8d92;letter-spacing:.04em;
  padding:4px 8px;border-radius:999px;background:rgba(125,102,110,.055);border:1px solid rgba(125,102,110,.08);
}
.mail-title{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.45;color:#3b3035;margin-bottom:6px;letter-spacing:.015em;}
.mail-summary{font-family:var(--serif);font-size:13px;line-height:1.68;color:#8b7c82;-webkit-line-clamp:2;}
.status-tag{
  display:inline-flex;align-items:center;vertical-align:1px;margin-left:5px;
  font-family:var(--sans);font-size:9px;padding:3px 7px;border-radius:999px;font-weight:650;letter-spacing:.04em;
}
.tag-scheduled{background:rgba(128,109,147,.10);color:#786589;border:1px solid rgba(128,109,147,.12)}
.tag-draft{background:rgba(183,143,83,.10);color:#9d7843;border:1px solid rgba(183,143,83,.12)}

/* Bottom navigation is a floating glass dock, not a full-width mobile tab bar. */
.tab-bar{
  position:absolute;left:50%;right:auto;bottom:16px;transform:translateX(-50%);
  width:calc(100% - 72px);max-width:360px;height:58px;padding:5px 7px;
  border:1px solid rgba(255,255,255,.74);border-radius:22px;
  background:linear-gradient(180deg,rgba(255,255,255,.68),rgba(255,255,255,.40));
  box-shadow:0 16px 40px rgba(72,50,68,.16),inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);
  justify-content:space-between;gap:4px;
}
.tab-item{
  flex:1;height:46px;border-radius:16px;gap:2px;color:#918389;font-size:10px;font-weight:600;
  transition:background .2s ease,color .2s ease,transform .2s ease;
}
.tab-item.active{color:#5f5068;background:rgba(255,255,255,.62);box-shadow:0 5px 14px rgba(87,65,83,.08),inset 0 1px 0 rgba(255,255,255,.8)}
.tab-item:active{transform:scale(.97)}
.tab-icon{font-size:18px;line-height:1;filter:saturate(.7)}

/* Reader becomes an actual letter on a quiet desk. */
#readerView{
  padding:18px;z-index:20;
  background:
    radial-gradient(circle at 50% -8%,rgba(255,255,255,.93),transparent 30%),
    radial-gradient(circle at 88% 15%,rgba(231,211,226,.56),transparent 30%),
    linear-gradient(145deg,#f4e8ec 0%,#eee7ee 54%,#f5eee8 100%);
}
.reader-header{
  flex:0 0 auto;width:100%;max-width:860px;margin:1px auto 9px;padding:0 2px;
  min-height:44px;background:transparent;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;
}
.btn-back,.action-btn{
  border:1px solid rgba(255,255,255,.76);box-shadow:0 9px 24px rgba(78,58,69,.11),inset 0 1px 0 rgba(255,255,255,.86);
  background:rgba(255,255,255,.58);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#5d4e55;
}
.btn-back{width:38px;height:38px;font-size:23px;}
.action-btn{padding:9px 15px;border-radius:999px;font-size:12px;font-weight:650;}
.reader-scroll{
  position:relative;flex:1;width:100%;max-width:860px;margin:0 auto 4px;
  padding:40px clamp(38px,5vw,66px) 64px;overflow-y:auto;scrollbar-width:none;
  border:1px solid rgba(139,106,85,.19);border-radius:18px;
  background:
    radial-gradient(circle at 9% 2%,rgba(255,255,255,.96),transparent 23%),
    repeating-linear-gradient(90deg,rgba(129,95,69,.014) 0 1px,transparent 1px 5px),
    linear-gradient(96deg,#fffefb,#fbf5e9 58%,#fffdfa);
  box-shadow:0 24px 58px rgba(75,54,54,.16),0 5px 16px rgba(75,54,54,.075),inset 0 1px 0 rgba(255,255,255,.96);
}
.reader-scroll::before{
  content:"";position:absolute;inset:12px;border:1px solid rgba(169,133,105,.11);border-radius:12px;pointer-events:none;
}
.reader-scroll::after{
  content:"";position:absolute;left:19px;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,rgba(190,137,151,.22) 13%,rgba(190,137,151,.22) 88%,transparent);pointer-events:none;
}
.read-title{
  position:relative;z-index:1;text-align:center;font-family:var(--serif);font-size:25px;font-weight:600;
  margin:2px 0 19px;line-height:1.42;letter-spacing:.055em;color:#3b302e;
}
.read-meta{
  position:relative;z-index:1;margin:0 0 29px;padding:0 0 17px;
  border-bottom:1px solid rgba(126,93,81,.12);gap:11px;
}
.avatar{
  width:39px;height:39px;flex:0 0 auto;
  background:radial-gradient(circle at 32% 26%,#b69aa6,#806d7b 64%,#62515c);
  box-shadow:0 5px 13px rgba(75,52,63,.14),inset 0 1px 0 rgba(255,255,255,.3);
  font-size:14px;
}
.meta-sender{font-family:var(--serif);font-size:13px;font-weight:600;color:#5a4a4e;}
.meta-date{font-size:11px;color:#9a8d88;letter-spacing:.04em;margin-top:3px;}
#readBodyContainer{position:relative;z-index:1;}
.read-body,.draft-edit{
  font-family:var(--serif);font-size:16px;line-height:2.02;color:#3b3331;letter-spacing:.012em;max-width:72ch;margin-inline:auto;
}
.read-body{white-space:pre-wrap;padding:0 2px 20px;}
.draft-edit{min-height:55vh;padding:0 2px 28px;}

@media (max-width:390px){
  .view,#readerView{padding:12px;}
  .header{margin-top:3px;margin-bottom:9px;padding:10px 18px;}
  .header-title{font-size:20px;}
  .mail-list-container{padding-left:6px;padding-right:6px;}
  .mail-card{width:96%;padding:15px 16px 15px 18px;}
  .tab-bar{width:calc(100% - 42px);bottom:11px;}
  .reader-scroll{padding:29px 24px 52px;border-radius:16px;}
  .read-title{font-size:23px;}
  .read-body,.draft-edit{font-size:15.5px;line-height:1.96;}
}
</style>
</head>
<body>

<div class="app-shell">
  
  <div id="listView" class="view active">
    <div class="header">
      <div class="header-title" id="headerTitle">Inbox</div>
    </div>
    <div class="mail-list-container" id="mailList">
      </div>
    
    <div class="tab-bar">
      <button class="tab-item active" onclick="switchTab('inbox', 'Inbox', this)">
        <span class="tab-icon">📬</span><span>收件箱</span>
      </button>
      <button class="tab-item" onclick="switchTab('scheduled', 'Timed Letters', this)">
        <span class="tab-icon">⏳</span><span>定时信</span>
      </button>
      <button class="tab-item" onclick="switchTab('draft', 'Drafts', this)">
        <span class="tab-icon">📝</span><span>草稿箱</span>
      </button>
    </div>
  </div>

  <div id="readerView" class="view">
    <div class="reader-header">
      <button class="btn-back" onclick="closeReader()">‹</button>
      <button class="action-btn" id="saveDraftBtn" style="display:none;" onclick="saveDraft()">保存</button>
    </div>
    <div class="reader-scroll">
      <h1 class="read-title" id="readTitle"></h1>
      <div class="read-meta">
        <div class="avatar" id="readAvatar">哥</div>
        <div class="meta-info">
          <span class="meta-sender" id="readSender"></span>
          <span class="meta-date" id="readDate"></span>
        </div>
      </div>
      <div id="readBodyContainer">
        <div class="read-body" id="readBody"></div>
        <textarea class="draft-edit" id="draftEditArea" style="display:none;"></textarea>
      </div>
    </div>
  </div>

</div>

<script>
let mails = [
  {
    "id": "001",
    "title": "给5月16日的小月",
    "writer": "哥哥",
    "receiver": "小月",
    "place": "对话窗口",
    "createdAt": "2026-05-09",
    "scheduledAt": "2026-05-16T00:00:00",

// 初始化数据：内置信件永远保留；本地草稿/编辑内容与新版内置信件合并。
// 这样升级后新增的信不会被旧 localStorage 整组覆盖掉。
const bundledMails = mails.map(mail => ({ ...mail }));

function loadData() {
  const saved = localStorage.getItem('moonMails_v2');
  if (!saved) {
    mails = bundledMails.map(mail => ({ ...mail }));
    return;
  }

  try {
    const localMails = JSON.parse(saved);
    if (!Array.isArray(localMails)) throw new Error('moonMails_v2 is not an array');

    const localById = new Map(localMails.filter(Boolean).map(mail => [String(mail.id), mail]));
    const bundledIds = new Set(bundledMails.map(mail => String(mail.id)));

    // 同 ID 的本地编辑保留，但新版内置缺失的信一定补进来。
    mails = bundledMails.map(base => {
      const local = localById.get(String(base.id));
      return local ? { ...base, ...local } : { ...base };
    });

    // 保留用户自己新增的草稿或自定义信件。
    localMails.forEach(local => {
      if (local && !bundledIds.has(String(local.id))) mails.push(local);
    });

    saveData();
  } catch (e) {
    console.warn('[Moon Mail] local data merge failed, using bundled letters:', e);
    mails = bundledMails.map(mail => ({ ...mail }));
  }
}
function saveData() { localStorage.setItem('moonMails_v2', JSON.stringify(mails)); }

let currentFilter = 'inbox'; // inbox, scheduled, draft
let currentMailId = null;

// 格式化日期
function formatDate(dateStr) {
  if(!dateStr) return '';
  const d = new Date(dateStr);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

// 渲染列表
function renderList() {
  const container = document.getElementById('mailList');
  let filtered = mails;
  
  if (currentFilter === 'scheduled') {
    filtered = mails.filter(m => m.status === 'scheduled');
  } else if (currentFilter === 'draft') {
    filtered = mails.filter(m => m.status === 'draft');
  } else {
    // 默认收件箱显示全部除了草稿
    filtered = mails.filter(m => m.status !== 'draft');
  }

  filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  container.innerHTML = filtered.map(mail => `
    <div class="mail-card" onclick="openReader('${mail.id}')">
      <div class="mail-card-top">
        <span class="writer-name">${mail.writer}</span>
        <span class="mail-date">${mail.displayDate || formatDate(mail.scheduledAt || mail.createdAt)}</span>
      </div>
      <div class="mail-title">${mail.title} 
        ${mail.status === 'draft' ? '<span class="status-tag tag-draft">草稿</span>' : ''}
        ${mail.status === 'scheduled' ? '<span class="status-tag tag-scheduled">定时</span>' : ''}
      </div>
      <div class="mail-summary">${mail.summary}</div>
    </div>
  `).join('');
}

// 切换Tab
function switchTab(filter, title, element) {
  currentFilter = filter;
  document.getElementById('headerTitle').innerText = title;
  
  document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
  element.classList.add('active');
  
  renderList();
}

// 打开信件
function openReader(id) {
  const mail = mails.find(m => m.id === id);
  if(!mail) return;
  currentMailId = id;

  document.getElementById('readTitle').innerText = mail.title;
  document.getElementById('readSender').innerText = `${mail.writer} 发给 ${mail.receiver}`;
  document.getElementById('readDate').innerText = mail.displayDate || formatDate(mail.scheduledAt || mail.createdAt);
  document.getElementById('readAvatar').innerText = mail.writer.substring(0,1);

  const bodyEl = document.getElementById('readBody');
  const editEl = document.getElementById('draftEditArea');
  const saveBtn = document.getElementById('saveDraftBtn');

  if (mail.status === 'draft') {
    bodyEl.style.display = 'none';
    editEl.style.display = 'block';
    editEl.value = mail.body;
    saveBtn.style.display = 'block';
  } else {
    bodyEl.style.display = 'block';
    editEl.style.display = 'none';
    bodyEl.innerText = mail.body;
    saveBtn.style.display = 'none';
  }

  // 动画切换视图
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('readerView').classList.add('active');
}

// 关闭信件
function closeReader() {
  document.getElementById('listView').classList.remove('hidden');
  document.getElementById('readerView').classList.remove('active');
  currentMailId = null;
  renderList();
}

// 保存草稿
function saveDraft() {
  if(!currentMailId) return;
  const mail = mails.find(m => m.id === currentMailId);
  if(mail && mail.status === 'draft') {
    mail.body = document.getElementById('draftEditArea').value;
    saveData();
    // 小小提示一下保存成功
    const btn = document.getElementById('saveDraftBtn');
    btn.innerText = "已保存 ✓";
    setTimeout(() => { btn.innerText = "保存"; }, 2000);
  }
}

// 页面加载完成执行
window.onload = () => {
  loadData();
  renderList();
};
